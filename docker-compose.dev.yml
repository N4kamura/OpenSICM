# ==============================================================
# OpenSICM - Docker Compose para Desarrollo y Pruebas Locales
# Levanta el Gateway y el Servidor Mock ATU simultáneamente
# Uso: docker compose -f docker-compose.dev.yml up -d
# ==============================================================
services:
  opensicm-gateway:
    build: .
    container_name: opensicm-gateway-dev
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "5001:5001"
    environment:
      - NODE_ENV=development
      - HTTP_PORT=3000
      - GPS_INGEST_PORT=5001
      - ATU_WS_ENDPOINT=ws://mock-atu:5000/ws
      - ATU_COMPANY_TOKEN=TOKEN_EMPRESA_DEMO_2026
      - TRANSMIT_INTERVAL_SEC=30
      - OFFLINE_QUEUE_MAX_SIZE=10000
      - OFFLINE_QUEUE_FILE=/app/data/offline_queue.json
    volumes:
      - ./data:/app/data
    depends_on:
      - mock-atu

  mock-atu:
    build: .
    container_name: opensicm-mock-atu
    command: ["node", "test/mock-atu-server.js"]
    ports:
      - "5000:5000"
    environment:
      - MOCK_ATU_PORT=5000
      - ATU_COMPANY_TOKEN=TOKEN_EMPRESA_DEMO_2026
