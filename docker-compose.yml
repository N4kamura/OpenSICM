# ==============================================================
# OpenSICM - Docker Compose para Despliegue en Producción
# ==============================================================
services:
  opensicm-gateway:
    build: .
    container_name: opensicm-gateway
    restart: always
    env_file:
      - .env
    ports:
      # Dashboard Web y API (3000)
      - "${HTTP_PORT:-3000}:3000"
      # Ingesta de Equipos GPS Físicos TCP (5001)
      - "${GPS_INGEST_PORT:-5001}:5001"
    volumes:
      # Persistencia de SQLite y cola offline directamente en disco del host
      - ./data:/app/data
    deploy:
      resources:
        limits:
          # Límite estricto de memoria para proteger el VPS contra sobreconsumo
          memory: 250M
    logging:
      driver: "json-file"
      options:
        # Rotación estricta de logs para evitar saturar el almacenamiento del VPS
        max-size: "10m"
        max-file: "3"
